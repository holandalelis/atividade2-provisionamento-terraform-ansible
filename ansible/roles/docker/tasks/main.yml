---
# Instala o Docker Engine pelo repositorio oficial da Docker.
# Todas as tasks usam modulos idempotentes: uma segunda execucao
# do playbook nao altera nada e reporta changed=0.

- name: Instalar dependencias para repositorio HTTPS
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Criar diretorio de chaves APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Baixar a chave GPG oficial da Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true

- name: Adicionar o repositorio APT da Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
    enabled: true
  become: true

- name: Instalar o Docker Engine
  ansible.builtin.apt:
    name: "{{ docker_pacotes }}"
    state: present
    update_cache: true
  become: true
  notify: Reiniciar docker

- name: Instalar o SDK Python do Docker (exigido pelos modulos community.docker)
  ansible.builtin.apt:
    name: "{{ docker_pacotes_python }}"
    state: present
  become: true

- name: Garantir que o servico do Docker esta ativo e habilitado no boot
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  become: true

- name: Adicionar o usuario "{{ docker_usuario }}" ao grupo docker
  ansible.builtin.user:
    name: "{{ docker_usuario }}"
    groups: docker
    append: true
  become: true
