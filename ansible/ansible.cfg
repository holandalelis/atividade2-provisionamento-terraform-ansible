[defaults]
inventory            = inventory/
roles_path           = roles
host_key_checking    = False
interpreter_python   = auto_silent
stdout_callback      = default
retry_files_enabled  = False
# Arquivo com a senha do vault. Esta no .gitignore: nunca vai para o repositorio.
vault_password_file  = .vault_pass

[inventory]
enable_plugins = amazon.aws.aws_ec2, host_list, script, auto, yaml, ini

[ssh_connection]
# Pipelining reduz o numero de operacoes SSH por task.
pipelining   = True
ssh_args     = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
